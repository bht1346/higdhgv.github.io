<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>惊喜！</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: "黑体", sans-serif;
            overflow: hidden;
        }

        /* 加载完成后红黄闪烁背景 */
        body.show-result {
            animation: bgFlash 0.5s infinite alternate;
        }

        @keyframes bgFlash {
            from { background-color: #ff0000; }
            to { background-color: #ffff00; }
        }

        /* 加载文字 */
        #loading {
            font-size: 24px;
            color: #333;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }

        /* 内容容器全局居中 */
        #content {
            display: none;
            text-align: center;
            width: 100%;
        }

        .main-text {
            font-size: 80px;
            font-weight: 900;
            color: #000;
            text-shadow: 3px 3px 0 #fff;
            animation: shake 0.1s infinite;
            margin-bottom: 40px;
        }

        .sub-text {
            font-size: 50px;
            font-weight: bold;
            color: #000;
            animation: shake 0.15s infinite reverse;
        }

        .emoji {
            font-size: 100px;
            margin: 30px 0;
            animation: bounce 0.3s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(5px, 5px) rotate(1deg); }
            50% { transform: translate(-5px, 5px) rotate(-1deg); }
            75% { transform: translate(5px, -5px) rotate(1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* 隐藏触发用图片 */
        #fakeImg {
            position: fixed;
            width: 0;
            height: 0;
            opacity: 0;
            pointer-events: none;
        }

        /* 跳过弹窗 */
        #skip-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            z-index: 9999;
            text-align: center;
        }
        #skip-modal div {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
        }
        #skip-modal button {
            padding: 10px 24px;
            font-size: 16px;
            border: none;
            background: #ff0000;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
        }

        /* 手机适配 */
        @media (max-width: 768px) {
            .main-text {
                font-size: 45px;
            }
            .sub-text {
                font-size: 30px;
            }
            .emoji {
                font-size: 60px;
            }
        }
    </style>
</head>
<body>
    <div id="loading">加载中</div>

    <div id="content">
        <div class="main-text">哈哈哈你被搞了！</div>
        <div class="emoji">🤣🤣🤣</div>
        <div class="sub-text">立刻转发给自己的两个朋友</div>
        <div class="sub-text" style="margin-top: 20px; color: #fff;">要不然是gay！</div>
    </div>

    <!-- 假图片，链接不存在，加载失败自动触发音频播放 -->
    <img id="fakeImg" src="https://invalid-image-link-1234567890.com/none.png">

    <!-- 一键跳过弹窗 -->
    <div id="skip-modal">
        <div>开发者选项</div>
        <button id="skip-btn">一键跳过加载</button>
    </div>

    <script>
        const BASE64_TXT = './usy_base64.txt';

        const loadingEl = document.getElementById('loading');
        const contentEl = document.getElementById('content');
        const skipModal = document.getElementById('skip-modal');
        const skipBtn = document.getElementById('skip-btn');
        const fakeImg = document.getElementById('fakeImg');

        let isSkipped = false;
        let prankAudio = null;

        // 读取 base64 文本解码生成MP3
        async function compileMp3FromBase64() {
            const res = await fetch(BASE64_TXT);
            let base64Str = await res.text();
            base64Str = base64Str.replace(/\s/g, '');

            const binary = atob(base64Str);
            const len = binary.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binary.charCodeAt(i);
            }

            const blob = new Blob([bytes], { type: 'audio/mpeg' });
            const audioUrl = URL.createObjectURL(blob);
            const audio = new Audio(audioUrl);
            audio.loop = true;

            await new Promise((resolve, reject) => {
                audio.addEventListener('canplaythrough', resolve);
                audio.addEventListener('error', reject);
                audio.load();
            });

            return audio;
        }

        // 直接展示恶搞页面
        function showResult() {
            loadingEl.style.display = 'none';
            document.body.classList.add('show-result');
            contentEl.style.display = 'block';
            skipModal.style.display = 'none';
        }

        // 图片加载失败自动播放音乐
        fakeImg.addEventListener('error', () => {
            if(prankAudio) prankAudio.play();
        });

        // 主加载流程
        async function init() {
            try {
                prankAudio = await compileMp3FromBase64();
                if (isSkipped) return;
                showResult();
            } catch (e) {}
        }

        // 右上角连续点击16次弹出开发者跳过窗口
        let clickCount = 0;
        let lastClickTime = 0;
        document.addEventListener('click', (e) => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const inTopRight = e.clientX > w * 0.8 && e.clientY < h * 0.2;
            if (!inTopRight) return;

            const now = Date.now();
            if (now - lastClickTime > 2000) clickCount = 0;
            lastClickTime = now;
            clickCount++;

            if (clickCount >= 16) {
                clickCount = 0;
                skipModal.style.display = 'block';
            }
        });

        // 一键跳过按钮
        skipBtn.addEventListener('click', () => {
            isSkipped = true;
            showResult();
            if(prankAudio) prankAudio.play();
        });

        window.addEventListener('load', init);
    </script>
</body>
</html>
