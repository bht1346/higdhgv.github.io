<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加载资源</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: "黑体", sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* 加载阶段容器 */
        #loadWrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            width: 80%;
            max-width: 500px;
        }

        #loadingText {
            font-size: 26px;
            color: #222;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }

        /* 进度条 */
        .progressBox {
            width: 100%;
            height: 16px;
            background: #ddd;
            border-radius: 99px;
            overflow: hidden;
        }
        .progressBar {
            height: 100%;
            width: 0%;
            background: #222;
            transition: width 0.08s linear;
        }

        /* 进入按钮，默认隐藏 */
        #enterBtn {
            display: none;
            margin-top: 20px;
            padding: 12px 40px;
            font-size: 20px;
            border: none;
            background: #111;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
        }

        /* 恶搞主页面 */
        #content {
            display: none;
            text-align: center;
            width: 100%;
        }
        body.show-result {
            animation: bgFlash 0.5s infinite alternate;
        }
        @keyframes bgFlash {
            from { background-color: #ff0000; }
            to { background-color: #ffff00; }
        }

        .main-text {
            font-size: 80px;
            font-weight: 900;
            color: #000;
            text-shadow: 3px 3px 0 #fff;
            animation: shake 0.1s infinite;
            margin-bottom: 40px;
        }
        .emoji {
            font-size: 100px;
            margin: 30px 0;
            animation: bounce 0.3s infinite;
        }
        .sub-text {
            font-size: 50px;
            font-weight: bold;
            color: #000;
            animation: shake 0.15s infinite reverse;
        }
        @keyframes bounce {
            0%,100%{transform:scale(1)}
            50%{transform:scale(1.3)}
        }
        @keyframes shake {
            0% { transform: translate(0,0) rotate(0deg); }
            25% { transform: translate(5px,5px) rotate(1deg); }
            50% { transform: translate(-5px,5px) rotate(-1deg); }
            75% { transform: translate(5px,-5px) rotate(1deg); }
            100% { transform: translate(0,0) rotate(0deg); }
        }

        /* 开发者弹窗 */
        #skip-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            background: #fff;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            z-index: 9999;
            text-align: center;
        }
        #skip-modal div {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
        }
        #skip-modal button {
            padding: 10px 24px;
            font-size: 16px;
            border: none;
            background: #f00;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
        }

        /* 手机适配 */
        @media (max-width:768px) {
            .main-text { font-size: 45px; }
            .sub-text { font-size: 30px; }
            .emoji { font-size: 60px; }
            #loadingText { font-size: 20px; }
        }
    </style>
</head>
<body>
    <!-- 加载界面 -->
    <div id="loadWrap">
        <div id="loadingText">加载中</div>
        <div class="progressBox">
            <div class="progressBar" id="bar"></div>
        </div>
        <button id="enterBtn">我知道了，点击进入</button>
    </div>

    <!-- 恶搞页面 -->
    <div id="content">
        <div class="main-text">哈哈哈你被搞了！</div>
        <div class="emoji">🤣🤣🤣</div>
        <div class="sub-text">立刻转发给自己的两个朋友</div>
        <div class="sub-text" style="margin-top:20px;color:#fff;">要不然是gay！</div>
    </div>

    <!-- 开发者调试弹窗 -->
    <div id="skip-modal">
        <div>开发者调试入口</div>
        <button id="devSkipBtn">一键跳过加载直接预览</button>
    </div>

<script>
const BASE64_FILE = "./usy_base64.txt";

const loadWrap = document.getElementById("loadWrap");
const loadingText = document.getElementById("loadingText");
const bar = document.getElementById("bar");
const enterBtn = document.getElementById("enterBtn");
const content = document.getElementById("content");
const skipModal = document.getElementById("skip-modal");
const devSkipBtn = document.getElementById("devSkipBtn");

let audio = null;
let loadComplete = false;

// 模拟进度条动画
function runProgress() {
    let width = 0;
    const timer = setInterval(()=>{
        width += Math.random() * 1.2;
        if(width >= 100) {
            width = 100;
            clearInterval(timer);
            loadComplete = true;
            enterBtn.style.display = "block";
        }
        bar.style.width = width + "%";
    },40);
}

// 读取base64转mp3音频
async function decodeAudio() {
    const res = await fetch(BASE64_FILE);
    let b64 = await res.text();
    b64 = b64.replace(/\s/g,"");
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    const blob = new Blob([arr],{type:"audio/mpeg"});
    const url = URL.createObjectURL(blob);
    const aud = new Audio(url);
    aud.loop = true;
    await new Promise((res)=>{aud.addEventListener("canplaythrough",res)});
    audio = aud;
}

// 切换到恶搞页面并播放音乐
function switchPrank() {
    loadWrap.style.display = "none";
    document.body.classList.add("show-result");
    content.style.display = "block";
    if(audio) audio.play();
}

// 进入按钮点击事件（唯一正常进入通道）
enterBtn.onclick = switchPrank;

// 右上角16次点击调出开发者跳过
let clickCount = 0;
let lastClick = 0;
document.addEventListener("click",(e)=>{
    const w = window.innerWidth;
    const h = window.innerHeight;
    const topRight = e.clientX > w*0.8 && e.clientY < h*0.2;
    if(!topRight) return;

    const now = Date.now();
    if(now - lastClick > 2000) clickCount = 0;
    lastClick = now;
    clickCount++;

    if(clickCount >= 16) {
        clickCount = 0;
        skipModal.style.display = "block";
    }
})

// 开发者一键跳过
devSkipBtn.onclick = ()=>{
    skipModal.style.display = "none";
    switchPrank();
}

// 页面初始化
window.onload = async ()=>{
    runProgress();
    await decodeAudio();
}
</script>
</body>
</html>
